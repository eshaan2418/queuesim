name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: clang++ }
          - { os: ubuntu-latest, cxx: g++ }
          - { os: macos-latest, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - if: runner.os == 'macOS'
        run: brew install ninja
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - run: cmake --build build -j 4
      - run: ctest --test-dir build -j 4 --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ -DQUEUESIM_SANITIZE=address,undefined
      - run: cmake --build build -j 4
      - run: ctest --test-dir build -j 2 --output-on-failure
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
